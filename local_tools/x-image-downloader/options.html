<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Img DL NSFW の設定</title>
  <link rel="stylesheet" href="options.css">
  <script src="core.js" defer></script>
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">X Img DL NSFW</p>
    <h1>保存先の設定</h1>
    <form id="settings-form">
      <fieldset id="settings-fields" disabled>
        <label for="directory">保存先フォルダ</label>
        <input id="directory" type="text" maxlength="180" placeholder="例：X画像/お気に入り" aria-describedby="directory-help preview" autocomplete="off" spellcheck="false">
        <p id="directory-help">Chromeのダウンロード先の中に作成します。例：<code>X画像/お気に入り</code>。空欄ならダウンロード先へ直接保存します。</p>
        <p id="preview" class="preview" aria-live="polite"></p>
        <label class="check"><input id="save-as" type="checkbox">毎回保存場所を選ぶ</label>
        <p>別のドライブや任意のフォルダを使う場合は、これをオンにして保存時の画面で選んでください。Chromeのダウンロード先自体はChromeの設定で変更できます。</p>
        <button type="submit">設定を保存</button>
      </fieldset>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>

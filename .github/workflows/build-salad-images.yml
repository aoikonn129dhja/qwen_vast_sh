name: Build Salad images
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to build
        type: choice
        default: all
        options:
          - all
          - qwen-rapid-aio-nsfw-v19
          - qwen-image-edit-2509
          - qwen-image-edit-2511
          - ltx-2.3-uncensored-v1.4-q4
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.model == 'all' && '["qwen-rapid-aio-nsfw-v19","qwen-image-edit-2509","qwen-image-edit-2511","ltx-2.3-uncensored-v1.4-q4"]' || format('["{0}"]', inputs.model)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free space for CUDA and PyTorch layers
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}/salad-${{ matrix.model }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: salad/models/${{ matrix.model }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
